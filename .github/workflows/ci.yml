name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: unit tests
        run: node --test test/
      - name: test vectors are reproducible from source
        run: |
          npm run vectors
          git diff --exit-code -- vectors/

  example:
    name: universal-output example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: derive keys for several networks
        run: node examples/universal-demo.mjs

  all-green:
    name: all-green
    needs: [test, example]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all required jobs passed"
